services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: cashflow
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: local-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  test:
    image: python:3.11.15-slim
    working_dir: /workspace
    command: sh -c "pip install --no-cache-dir -e '.[dev]' && ruff check . && pytest -q"
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
