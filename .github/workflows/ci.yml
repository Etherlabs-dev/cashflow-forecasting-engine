name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest -q
      - run: PYTHONPATH=src python scripts/run_synthetic_backtest.py
      - run: git diff --exit-code results/synthetic_backtest.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard-react/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: cashflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cashflow"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d cashflow -f sql/schema.sql
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d cashflow -f tests/sql_smoke.sql
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cashflow-forecast-engine .
